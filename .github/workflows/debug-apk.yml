name: Build Debug APK (arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - "vibe/**"
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Build arm64-only debug APK
        run: bash ./gradlew :androidApp:assembleFossDebug -Prekai.arm64Only=true --stacktrace

      - name: Rename APK
        run: |
          ls -la androidApp/build/outputs/apk/foss/debug/
          cp androidApp/build/outputs/apk/foss/debug/*arm64-v8a*.apk Re-Kai-debug-arm64.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Re-Kai-debug-arm64
          path: Re-Kai-debug-arm64.apk
          if-no-files-found: error
